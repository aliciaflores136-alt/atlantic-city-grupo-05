<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>NUEVA VISITA | Atlantic City</title>
        <link rel="stylesheet" href="/vendor/bootstrap.min.css"><link rel="stylesheet" href="../css/estilos.css">
    </head>
    <body>
        <header>
            <div class="marca">
                <img src="../recursos/logo.png" alt="Atlantic City Casino">
            </div>
            <nav aria-label="Navegación principal">
                <a href="panel.html">Panel principal</a>
                <a href="clientes.html">Clientes</a>
                <a href="visitas.html">Visitas y juegos</a>
                <a href="atencion.html">Atención al cliente</a>
                <a href="../index.html" id="salir">Salir</a>
            </nav>
        </header>
        <main>
            <h1>NUEVA VISITA</h1>
            <p class="subtitulo">Registra la visita y sus detalles.</p>
            <p id="aviso" class="aviso" role="status" hidden></p>
            <form id="visita" class="tarjeta" novalidate>
                <p class="ayuda">Los campos con * son obligatorios.</p>
                <div class="rejilla">
                    <div class="campo">
                        <label for="clienteId">Cliente *</label>
                        <select id="clienteId" name="clienteId" required class=" form-select">
                            <option value="">Selecciona una opción</option>
                        </select>
                        <small class="error" id="error-clienteId" aria-live="polite"></small>
                    </div>
                    <div class="campo">
                        <label for="entrada">Fecha y hora de entrada *</label>
                        <input id="entrada" name="entrada" type="datetime-local" required class=" form-control" step="1">
                        <small class="error" id="error-entrada" aria-live="polite"></small>
                    </div>
                    <div class="campo">
                        <label for="salida">Fecha y hora de salida</label>
                        <input id="salida" name="salida" type="datetime-local" class=" form-control" step="1">
                        <small class="error" id="error-salida" aria-live="polite"></small>
                    </div>
                    <div class="ancho">
                        <h2>Detalles de la visita</h2>
                        <p class="ayuda">Agrega una fila por cada juego utilizado.</p>
                        <div id="juegos"></div>
                        <button type="button" class="secundario" id="agregar-juego">Agregar otro juego</button>
                    </div>
                    <div class="acciones">
                        <a class="boton secundario" href="visitas.html">Cancelar</a>
                        <button disabled>Guardar visita</button>
                    </div>
                </div>
            </form>
        </main>
        <footer> </footer>
        <script src="../js/comun.js"></script>
        <script src="../js/visitas.js"></script>
    </body>
    </html>
