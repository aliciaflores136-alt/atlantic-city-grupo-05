<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DETALLE DEL CLIENTE | Atlantic City</title>
        <link rel="stylesheet" href="/vendor/bootstrap.min.css"><link rel="stylesheet" href="../css/estilos.css">
    </head>
    <body>
        <header>
            <div class="marca">
                <img src="../recursos/logo.png" alt="Atlantic City Casino">
            </div>
            <nav aria-label="Navegación principal">
                <a href="panel.html">Panel principal</a>

            <h1>DETALLE DEL CLIENTE</h1>
            <p class="subtitulo">Consulta los datos y el historial de visitas.</p>
            <p id="aviso" class="aviso" role="status" hidden></p>
            <section class="tarjeta">
                <div id="detalle"></div>
                <div class="acciones">

            <h2>Historial de visitas</h2>
            <div class="tabla">
                <table class=" table table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Fecha</th>
                            <th scope="col">Horario</th>
                            <th scope="col">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="historial"></tbody>
                </table>

        <footer></footer>
